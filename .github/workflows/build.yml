name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 22.04 ships arm-none-eabi-gcc 10.3, the toolchain the
    # AeroStem H743 V1 bootloader and firmware are tested with.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi
          pip3 install "empy==3.3.4" pymavlink future intelhex pexpect
          arm-none-eabi-gcc --version | head -1

      - name: Build
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aerostem-lightshow
          path: dist/

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "AeroStem LightShow $GITHUB_REF_NAME" \
              --notes "Firmware for the AeroStem H743 V1. Flash *_with_bl.hex with STM32CubeProgrammer (DFU), or load the .apj from a ground station. Complete source code (GPL-3.0) is attached as *-source.tar.xz."
          fi
